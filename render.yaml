# Render blueprint for the Orbit CRM FastAPI backend.
#
# SECRETS ARE NEVER STORED IN THIS FILE. Every sensitive value below is declared
# with `sync: false`, which tells Render to prompt for it in the dashboard
# (Service → Environment) instead of reading it from the repository. This file
# is committed to git and pushed to GitHub — anything given a literal `value:`
# here is public to everyone with repository access.
#
# NOTE: the live service is currently deployed as `aura-crm-hn11`
# (https://aura-crm-hn11.onrender.com), not the `orbit-crm-backend` name below.
# Reconcile the two before using this blueprint to provision a new service.
services:
  - type: web
    name: orbit-crm-backend
    runtime: python3
    region: ohio
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      # ── Secrets: set these in the Render dashboard, never here ──────────
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: OPENCLAW_GATEWAY_TOKEN
        sync: false
      - key: OLLAMA_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false

      # ── Non-secret configuration ───────────────────────────────────────
      - key: SUPABASE_URL
        value: https://qavfajsflzbefgegkwjt.supabase.co
      - key: EXPECTED_SUPABASE_PROJECT_REF
        value: qavfajsflzbefgegkwjt
      - key: GITHUB_REPO
        value: infinitytechmain2024/aura-crm
      - key: AI_WORKFLOW_WORKER_ENABLED
        value: "true"
      - key: AI_WORKFLOW_AUTORUN
        value: "true"
      - key: AI_WORKFLOW_WORKER_CONCURRENCY
        value: "4"
      - key: AI_WORKFLOW_POLL_INTERVAL_SECONDS
        value: "1.5"
      - key: CORS_ORIGINS
        value: '["https://aura-crm.vercel.app","http://localhost:5173","http://localhost:3000"]'
      - key: OPENCLAW_URL
        value: http://127.0.0.1:18789
      - key: OLLAMA_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: OLLAMA_MODEL
        value: openai/gpt-oss-120b
      - key: WHISPER_MODEL
        value: tiny
