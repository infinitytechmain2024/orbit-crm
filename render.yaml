services:
  - type: web
    name: orbit-crm-backend
    runtime: docker
    region: ohio
    # Production requires an always-on instance. Do not apply this paid plan
    # change until staging smoke tests and budget approval are complete.
    plan: starter
    dockerfilePath: ./backend/Dockerfile.combined
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NVIDIA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: EXPECTED_SUPABASE_PROJECT_REF
        value: qavfajsflzbefgegkwjt
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: SELFDEV_PROVIDER_TOKEN
        sync: false
      - key: SELFDEV_PROVIDER_LEASE_SECONDS
        value: "90"
      - key: SELFDEV_ORGANIZATION_ID
        value: f009bee0-c0d0-47eb-a5d0-4e291a43a700
      - key: SELFDEV_PROVIDER_NAME
        value: render-openclaw-provider
      - key: SELFDEV_EXECUTION_ENABLED
        value: "true"
      - key: SELFDEV_AGENT_COMMAND
        value: /opt/orbit-venv/bin/python -m selfdev.provider.openclaw_agent
      - key: SELFDEV_JOB_TIMEOUT_SECONDS
        value: "900"
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: WHISPER_LANGUAGE
        value: ru
      - key: CEO_APPROVAL_REQUIRED_RISK_LEVELS
        value: "high,critical"
      - key: CEO_DEPLOYMENT_APPROVAL_REQUIRED
        value: "true"
      - key: OPENCLAW_URL
        value: http://127.0.0.1:18789
      - key: OPENCLAW_GATEWAY_TOKEN
        sync: false
      - key: OPENCLAW_WEBHOOK_TOKEN
        sync: false
      - key: OPENCLAW_REQUEST_TIMEOUT
        value: "120.0"
      - key: OPENCLAW_DAILY_ACTION_LIMIT
        value: "100"
      - key: OPENCLAW_MAX_CONTEXT_RECORDS
        value: "20"
