services:
  - type: pserv
    name: orbit-openclaw-private
    runtime: docker
    region: ohio
    plan: starter
    dockerfilePath: ./services/openclaw/Dockerfile
    dockerContext: ./services/openclaw
    envVars:
      - key: HOME
        value: /home/node
      - key: OPENCLAW_HOME
        value: /home/node
      - key: OPENCLAW_STATE_DIR
        value: /home/node/.openclaw
      - key: OPENCLAW_CONFIG_PATH
        value: /home/node/.openclaw/openclaw.json
      - key: OPENCLAW_CONFIG_DIR
        value: /home/node/.openclaw
      - key: OPENCLAW_WORKSPACE_DIR
        value: /home/node/.openclaw/workspace
      - key: OPENCLAW_GATEWAY_TOKEN
        generateValue: true
      - key: PORT
        value: "18789"
      - key: OPENCLAW_GATEWAY_BIND
        value: lan
      - key: OPENCLAW_GATEWAY_PORT
        value: "18789"
      - key: OPENCLAW_DISABLE_BONJOUR
        value: "1"
      - key: NVIDIA_API_KEY
        sync: false
      - key: OPENCLAW_DEFAULT_MODEL
        value: "nvidia/nvidia/nemotron-3-ultra-550b-a55b"
    disk:
      name: openclaw-state
      mountPath: /home/node/.openclaw
      sizeGB: 1

  - type: web
    name: orbit-crm-backend
    runtime: python
    region: ohio
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: NVIDIA_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: EXPECTED_SUPABASE_PROJECT_REF
        value: qavfajsflzbefgegkwjt
      - key: INTERNAL_API_TOKEN
        sync: false
      - key: WHISPER_MODEL
        value: tiny
      - key: WHISPER_DEVICE
        value: cpu
      - key: WHISPER_COMPUTE_TYPE
        value: int8
      - key: WHISPER_LANGUAGE
        value: ru
      - key: CEO_APPROVAL_REQUIRED_RISK_LEVELS
        value: "high,critical"
      - key: CEO_DEPLOYMENT_APPROVAL_REQUIRED
        value: "true"
      - key: OPENCLAW_URL
        fromService:
          type: pserv
          name: orbit-openclaw-private
          property: hostport
      - key: OPENCLAW_GATEWAY_TOKEN
        fromService:
          type: pserv
          name: orbit-openclaw-private
          envVarKey: OPENCLAW_GATEWAY_TOKEN
      - key: OPENCLAW_WEBHOOK_TOKEN
        sync: false
      - key: OPENCLAW_REQUEST_TIMEOUT
        value: "120.0"
      - key: OPENCLAW_DAILY_ACTION_LIMIT
        value: "100"
      - key: OPENCLAW_MAX_CONTEXT_RECORDS
        value: "20"
